# =====================
# PREFIX
# =====================
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# =====================
# SPLITS
# =====================
unbind '"'
unbind %

# Horizontal / vertical splits
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# =====================
# PANE NAVIGATION (vim-style)
# =====================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Alt + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =====================
# WINDOW MANAGEMENT
# =====================
# Create new window ("zone") in current path
bind n new-window -c "#{pane_current_path}"

# Close current pane
bind c kill-pane

# Quit session (leader + d) with confirmation
bind z confirm-before -p "Kill this session? (y/n)" "kill-session -t #{session_name}"

# Jump to windows 0–3
bind u select-window -t 0
bind i select-window -t 1
bind o select-window -t 2
bind p select-window -t 3

# Optional: previous / next window
bind [ previous-window
bind ] next-window

# =====================
# MOUSE & CLIPBOARD
# =====================
set -g mouse on
set-option -g set-clipboard on

# =====================
# WINDOW BEHAVIOR
# =====================
setw -g automatic-rename on
# set -g wrap-around on

# =====================
# STATUS BAR (simple)
# =====================
set -g status on
set -g status-interval 1
set -g status-left-length 50
set -g status-right-length 150

# Active window highlighted: bold yellow
setw -g window-status-current-style bold,fg=yellow
setw -g window-status-style fg=white
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Status left/right
set -g status-left "#S "
set -g status-right "%Y-%m-%d %H:%M "
set -g status-bg black
set -g status-fg white

# =====================
# COPY MODE
# =====================
setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
